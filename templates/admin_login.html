<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Bhathwari Technologies</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-layout container">
    <section class="login-card" aria-labelledby="admin-login-title">
      <p class="eyebrow">Admin access</p>
      <h1 id="admin-login-title">Admin sign in</h1>
      <form method="post" class="login-form">
        <label>Username<input name="username" type="text" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="login-submit" type="submit">Sign in <span>→</span></button>
        {% if error %}
          <div class="login-message is-error">{{ error }}</div>
        {% endif %}
      </form>
      <p class="login-help">Use your admin credentials to view user orders and confirm dispatch.</p>
    </section>
  </main>
</body>
</html>
